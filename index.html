/* Full-window task reader. Editing and the faculty organiser keep their original layout. */
.layout.viewing{display:block;min-height:100dvh;background:#fff}
.layout.viewing .sidebar,.layout.viewing .topbar{display:none}
.layout.viewing .main{height:100dvh;min-width:0}
.layout.viewing .content{max-width:none;width:100%;height:100%;margin:0;padding:0}
.viewerWrap{width:100%;max-width:none;height:100dvh;margin:0}
.viewerWrap .viewerShell{display:flex;flex-direction:column;height:100%;width:100%;border:0;border-radius:0;box-shadow:none;overflow:hidden;background:#fff}
.viewerWrap .viewerTop{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(12px,1.6vw,28px);padding:12px clamp(18px,3vw,48px);min-height:77px;background:white}
.viewerBack{min-width:78px}
.viewerIdentity{min-width:0;display:flex;align-items:center;gap:13px}
.viewerLogo{width:39px;height:39px;object-fit:contain;flex-shrink:0}
.viewerIdentityText{min-width:0}
.viewerSchool{font-size:11px;font-weight:750;color:var(--muted);line-height:1.2}
.viewerTaskName{font-size:clamp(15px,1.35vw,19px);font-weight:780;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35;margin-top:3px}
.viewerTools{display:flex;align-items:center;gap:8px;flex-shrink:0}
.viewerMode{display:flex;gap:2px;background:#f1f5f9;border:1px solid #e4eaf0;border-radius:9px;padding:3px}
.viewRole{border:0;border-radius:7px;background:transparent;color:#50657b;padding:6px 11px;font-size:12px;font-weight:750}
.viewRole.active{background:#fff;color:#173f6f;box-shadow:0 1px 5px #173f6f1a}
.viewerPageRail{display:flex;flex:none;gap:3px;width:100%;height:4px;background:#edf2f7}
.viewerPageSegment{flex:1;background:#dae5ef}
.viewerPageSegment.past{background:#91b0d0}
.viewerPageSegment.active{background:#245eac}
.viewerWrap .viewerSlide{flex:1;min-height:0;overflow-y:auto;overscroll-behaviour:contain;padding:clamp(22px,3.4vw,56px) clamp(18px,5.4vw,90px) 36px;background:#fff}
.viewerSlideInner{width:min(100%,1260px);margin:0 auto}
.viewerWrap .slideTitle{font-size:clamp(28px,3vw,44px);margin:0 0 26px;letter-spacing:-.9px}
.viewerWrap .slideNumber{margin:0 0 8px;font-size:12px;color:var(--blue);letter-spacing:.8px}
.viewerWrap .viewerContent{font-size:clamp(17px,1.45vw,20px);line-height:1.65;max-width:1050px;overflow-wrap:anywhere}
.introContext{max-width:1050px;margin-bottom:24px;border-left:3px solid #b9ccdf;padding:4px 0 5px 22px}
.introContext h2,.additionalConditions h2{font-size:16px;margin:0 0 8px;color:#334c68}
.introContext .viewerContent{font-size:clamp(15px,1.1vw,17px);line-height:1.55;color:#41566c}
.taskOverview{background:#f1f2fc;border-left:4px solid #657fc0;border-radius:9px;padding:clamp(18px,2.3vw,32px);}
.viewerWrap .conditionGrid{max-width:1150px;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.viewerWrap .detailTile{padding:22px 24px}
.viewerWrap .detailTile span{font-size:17px;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.additionalConditions{margin-top:30px;max-width:1000px}
.termviewWrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:1200px}
.viewerWrap .termview{display:flex;flex-direction:column;gap:8px;padding:19px 23px;border:1px solid var(--line);border-radius:11px;background:#fafcff;max-width:none}
.viewerWrap .termview>*{padding:0;border:0;background:none!important}
.viewerWrap .termview strong{font-size:17px}
.viewerWrap .termview span{font-size:16px;line-height:1.55}
.viewerWrap .checkline{max-width:1170px;gap:19px;padding:19px 22px;margin:12px 0;align-items:flex-start}
.viewerWrap .checkline label{font-size:clamp(16px,1.35vw,19px);line-height:1.6}
.viewerWrap .checkline input{width:25px;height:25px}
.viewerWrap .viewerBottom{flex:none;gap:18px;flex-wrap:nowrap;padding:12px clamp(18px,3vw,48px);min-height:78px;background:#f9fbfe}
.viewerProgress{width:230px;max-width:34vw;font-size:12px;color:#52677d;font-weight:750}
.viewerProgress .progressRail{margin-top:7px}
.viewerPageCount{font-weight:750;color:#52677d;font-size:13px;margin-left:auto}
.viewerWrap .slideBtns{flex:none;gap:9px}
.viewerWrap .slideBtns button{min-width:116px}
@media(max-width:790px){
 .viewerWrap .viewerTop{grid-template-columns:auto minmax(0,1fr);gap:10px 14px;padding:11px 17px}
 .viewerIdentity{grid-column:2}
 .viewerTools{grid-column:1/-1;justify-content:flex-end}
 .viewerTaskName{font-size:15px}
 .viewerWrap .viewerSlide{padding:24px 20px 32px}
 .termviewWrap{grid-template-columns:1fr}
}
@media(max-width:540px){
 .viewerWrap .viewerTop{min-height:0}
 .viewerBack{min-width:0}
 .viewerBack span{display:none}
 .viewerLogo{width:29px;height:29px}
 .viewerSchool{font-size:10px}
 .viewerTools{gap:5px}
 .viewerTools>.btn{padding:7px 10px}
 .viewRole{padding:7px 10px}
 .viewerWrap .viewerSlide{padding:21px 15px 30px}
 .viewerWrap .slideTitle{font-size:28px;margin-bottom:20px}
 .viewerWrap .viewerContent{font-size:16px}
 .viewerWrap .conditionGrid{grid-template-columns:1fr}
 .viewerWrap .checkline{padding:15px 12px;gap:10px}
 .viewerWrap .checkline label{font-size:16px}
 .viewerWrap .viewerBottom{padding:10px 13px;gap:10px;flex-wrap:wrap}
 .viewerProgress{max-width:none;width:calc(100% - 56px);order:0}
 .viewerPageCount{order:1}
 .viewerWrap .slideBtns{order:2;width:100%;justify-content:space-between}
 .viewerWrap .slideBtns button{min-width:0;flex:1;padding:8px}
}

.viewerEssentialQuestion{font-size:1.13em;line-height:1.5;margin:15px 0 20px;padding:0 0 4px;color:#162943}
/* Condition editor: editable labels, values and removable fields */
.conditionEditor{display:grid;gap:10px;margin-bottom:18px}.conditionEditRow{display:grid;grid-template-columns:minmax(180px,1fr) minmax(260px,1.8fr) 40px;gap:12px;align-items:end;background:#f7faff;border:1px solid #e2eaf3;padding:12px;border-radius:10px}.conditionEditRow .field{margin:0}.conditionEditRow .btn{height:41px}.printConditions{display:grid;grid-template-columns:1fr 1fr;gap:6pt}.printCondition{background:#e6f1fc;padding:5pt 7pt;break-inside:avoid}.printCondition strong{display:block;color:#204c7d;font-size:9pt}.printCondition span{display:block;white-space:pre-wrap}.printKeyTerms tr:nth-child(odd) td{background:#d9eafa}.printKeyTerms tr:nth-child(even) td{background:#eef6fe}
@media(max-width:700px){.conditionEditRow{grid-template-columns:1fr 1fr 38px;gap:8px}.conditionEditRow .field{min-width:0}}@media(max-width:490px){.conditionEditRow{grid-template-columns:1fr 40px}.conditionEditRow .field:nth-child(2){grid-column:1}.conditionEditRow .btn{grid-column:2;grid-row:1/3;align-self:center}}
/* Print layout: A4, first page task / second page Steps for Success */
@page{size:A4;margin:12mm 14mm 14mm}
@media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}html,body{background:white!important;color:#000}.layout,.modalBackdrop{display:none!important}.printDocument{display:block!important;font:10.5pt/1.35 Arial,sans-serif;color:#101010}.printHeader{display:flex;justify-content:space-between;align-items:center;border-top:1.5pt solid #333;padding-top:6pt;gap:12pt}.printHeader img{width:auto;max-width:27mm;max-height:25mm;object-fit:contain}.printSchool{font-size:9pt;margin-top:3pt;color:#555}.printTitle{font-size:17pt;font-weight:bold;margin:9pt 0 15pt}.printLabel{font-weight:bold;text-transform:uppercase;font-size:13.5pt;margin:14pt 0 7pt}.printTask{background:#e8e9f7;border-top:1pt solid #8288c2;border-bottom:1pt solid #8288c2;padding:11pt 10pt;margin:15pt 0 18pt;white-space:pre-wrap}.printTask p{margin:0 0 4pt}.printTwo{display:grid;grid-template-columns:1fr 1fr;gap:14pt;margin:10pt 0 15pt}.printTwo strong{display:block;margin-bottom:3pt}.printKeyTerms{width:100%;border-collapse:collapse}.printKeyTerms td{padding:5pt 6pt;vertical-align:top}.printKeyTerms tr:nth-child(odd) td{background:#eaeaea}.printKeyTerms tr:nth-child(even) td{background:#fff}.printKeyTerms td:first-child{width:30%;font-weight:600}.printpage2{break-before:page;page-break-before:always;padding-top:1pt}.printSectionTitle{background:#ececec;color:#242424;break-after:avoid;page-break-after:avoid;padding:5pt 8pt;font-weight:bold;font-size:12.5pt;margin:9pt 0 5pt}.printStepsHeader{background:#424242;color:white;font-size:15pt;font-weight:800;padding:7pt 9pt;margin-bottom:10pt;display:flex;justify-content:space-between}.printStep{display:flex;gap:8pt;align-items:flex-start;padding:3pt 5pt 4pt 25pt;break-inside:avoid;page-break-inside:avoid}.printStep .printLetter{width:18pt;flex-shrink:0}.printStep .printText{flex:1;white-space:pre-wrap}.printCheckbox{width:11pt;height:11pt;flex-shrink:0;border:1.2pt solid black;margin-top:1pt;display:flex;align-items:center;justify-content:center;font-size:11pt;line-height:1}.printFoot{font-size:8pt;color:#555;margin-top:14pt;display:flex;justify-content:space-between;border-top:1px solid #ccc;padding-top:6pt}.printTask:empty{display:none}.printConditions{grid-template-columns:1fr 1fr;gap:5pt}.printCondition{padding:4pt 6pt;background:#f6f6f6;color:#242424}.printCondition strong{color:#242424}}

/* Compact, wrapping toolbars: primary actions first, rarely-used tools in dropdowns. */
.homeActionBar,.editorActions{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:6px;max-width:100%;margin-left:auto}
.homeActionBar .btn,.editorActions .btn{min-height:33px;padding:6px 10px;font-size:12.5px;box-shadow:none}
.headrow{align-items:center;gap:12px;margin-bottom:17px}.headrow>div:first-child{flex:1 1 280px;min-width:200px}.headrow .eyebrow{margin-bottom:3px}.headrow h1{margin-bottom:4px}.headrow p{font-size:12px;margin:0}
.actionMenu{position:relative;flex-shrink:0}.actionMenu>summary{list-style:none;cursor:pointer;display:inline-flex}.actionMenu>summary::-webkit-details-marker{display:none}
.menuContents{position:absolute;top:calc(100% + 5px);right:0;width:190px;z-index:25;border:1px solid #d9e4ef;box-shadow:0 12px 32px #132c4333;background:#fff;border-radius:10px;padding:8px;display:grid;gap:5px}
.menuContents .btn{justify-content:flex-start;white-space:normal;text-align:left;width:100%}
.reviewWarning{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;width:19px;height:19px;background:#c72d3f;color:#fff;border-radius:50%;font-size:13px;font-weight:950;line-height:1;margin-right:5px}
.taskrow{align-items:center}.taskrow .taskheading{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.editorHead{gap:8px}.editorHead>div:first-child{flex:1 1 250px}.editorActions{flex:0 1 auto}
.converterModal{width:min(900px,95vw);max-height:min(93dvh,900px);overflow-y:auto}.convertUploader{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed #afc3d8;padding:16px;border-radius:10px;background:#f7faff}
.convertUploader input{width:min(100%,440px);font-size:13px}.converterSummary{margin:14px 0;padding:12px;border-radius:9px;background:#e9f5ed;color:#155b45}
.conversionTable{max-height:320px;overflow:auto;border:1px solid #dce5ed;border-radius:8px}.conversionTable table{border-collapse:collapse;width:100%;font-size:12px}.conversionTable th,.conversionTable td{padding:8px;border-bottom:1px solid #dce5ed;text-align:left}.conversionTable thead th{position:sticky;top:0;background:#eff4fa}
.sourceTextPanel{margin-bottom:20px}.sourceTextPanel pre{white-space:pre-wrap;word-break:break-word;max-height:250px;overflow:auto;background:#f3f6f9;padding:12px;font-size:12px}
/* A page is a viewport, not a scaled-down A4 document. */
.viewerWrap .viewerTop{min-height:58px;padding:7px clamp(12px,2vw,30px)}.viewerWrap .viewerBottom{min-height:62px;padding:7px clamp(12px,2vw,30px)}
.viewerWrap .viewerSlide{overflow-y:hidden;padding:clamp(12px,2vh,30px) clamp(14px,3vw,52px)}
.viewerWrap .viewerSlide.readerOverflow{overflow-y:auto}
.viewerWrap .slideTitle{font-size:clamp(22px,2.5vw,34px);margin:0 0 clamp(10px,1.5vh,22px)}
.viewerWrap .viewerContent{font-size:clamp(15px,1.3vw,19px);line-height:1.55;max-width:100%;}
.viewerWrap .readerIntro{white-space:pre-wrap;max-width:1100px;padding:clamp(14px,2vw,24px);}
.viewerWrap .conditionGrid{gap:10px}.viewerWrap .detailTile{padding:12px 18px}.viewerWrap .detailTile span{font-size:clamp(14px,1.2vw,17px)}
.viewerWrap .termview{padding:10px 15px}.viewerWrap .termview span{font-size:clamp(14px,1.1vw,16px);line-height:1.4}.viewerWrap .termview strong{font-size:15px}
.viewerWrap .checkline{padding:12px 16px;margin:8px 0}.viewerWrap .checkline label{font-size:clamp(15px,1.3vw,18px);line-height:1.5}.viewerWrap .checkline input{width:23px;height:23px}.checkPlaceholder{width:23px;flex:none}
.criterionCard{max-width:1000px}.criterionTitle{font-size:clamp(16px,1.7vw,21px);font-weight:800;margin-bottom:16px}.gradeTabs{display:flex;gap:7px;margin-bottom:14px}.gradeTab{padding:7px 15px;background:#f1f5fa;color:#244e73;border:1px solid #cddbe8;border-radius:8px;font-weight:800}.gradeTab.active{background:#214d81;color:white}
.descriptorContent{border:1px solid #dce5ed;padding:16px;border-radius:9px;background:#f8fafc;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(14px,1.25vw,17px)}.descriptorContent strong{display:block;margin-bottom:7px}.markingInline{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}

@media(max-width:540px){.content{padding:16px 12px 38px}.headrow{gap:8px}.headrow .eyebrow,.headrow p{display:none}.headrow h1{font-size:24px}.homeActionBar{width:100%;gap:5px}.homeActionBar .btn{font-size:11.5px;padding:6px 7px}.editorActions{justify-content:flex-start;width:100%}.viewerWrap .viewerTop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px;padding:4px 9px}.viewerWrap .viewerTools{grid-column:1/-1;justify-content:flex-end}.viewerWrap .viewerBottom{gap:5px;min-height:0}.viewerWrap .viewerSlide{padding:10px 12px}.viewerWrap .slideTitle{font-size:23px;margin-bottom:12px}.viewerWrap .viewerContent{font-size:15px}.viewerWrap .checkline label{font-size:15px}.viewerWrap .detailTile{padding:9px 12px}.viewerProgress{width:120px;max-width:40vw}.viewerWrap .slideBtns button{font-size:13px;min-height:36px}.viewerWrap .readerIntro{padding:12px}.viewerWrap .termview{padding:9px 11px}}

.aiLevelEditor{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.aiLevelEditor label{font-size:12px;font-weight:750;color:#50657b;white-space:nowrap}
.aiLevelEditor select{max-width:183px;min-height:35px;border:1px solid #becddb;border-radius:8px;background:white;color:#223e59;font-size:12px;padding:5px 6px}
.aiSectionBadge{display:inline-flex;align-items:center;justify-content:center;gap:4px;flex-shrink:0;border-radius:6px;background:var(--ai-colour);color:var(--ai-text,#fff);border:1px solid transparent;padding:4px 8px;font-weight:800;font-size:11px;line-height:1.2;letter-spacing:.1px;white-space:nowrap;text-align:center}
.aiLevelDetails{position:relative;flex:none;margin-left:auto;z-index:3}
.aiLevelDetails summary{list-style:none;cursor:pointer}

.aiLevelDetails[open] .aiSectionBadge{outline:2px solid #94b7db;outline-offset:2px}
.aiLevelExplain{position:absolute;z-index:50;right:0;top:calc(100% + 9px);width:min(310px,78vw);box-shadow:0 10px 28px #162f4e26;border:1px solid #ccd9e5;border-radius:9px;background:#fff;color:#233c53;padding:13px 15px;font-size:13px;font-weight:450;line-height:1.45;letter-spacing:0}
.slideHeadingRow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:clamp(10px,1.5vh,22px)}
.viewerWrap .slideHeadingRow .slideTitle{margin:0;min-width:0;flex:0 1 auto}
.printSectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10pt}
.printSectionTitle .aiSectionBadge{font:700 8pt/1.15 Arial,sans-serif;border-radius:2pt;padding:3pt 5pt}
@media(max-width:850px){.sectionTitleRow{flex-wrap:wrap}.aiLevelEditor{order:2;width:100%;justify-content:flex-start;margin-left:30px}.aiLevelEditor select{max-width:min(300px,75vw)}.slideHeadingRow{align-items:flex-start}}

const demo={"id":"sample-ev3-warehouse-2026","faculty":"Technologies","subject":"Digital Technologies","unit":"Robotics and automation","name":"EXAMPLE · EV3 Warehouse Delivery","title":"EV3 Warehouse Delivery Challenge","code":"SAMPLE · Year 9 Robotics","year":"9","context":"A busy warehouse wants to trial a small autonomous robot to move parcels between dispatch points and storage bays. Each collection area and delivery bay has a colour marker. The robot will need to follow a route, recognise locations, pick up parcels and deliver them without continuous human control.","task":"Your task is to design, program, test and evaluate a LEGO MINDSTORMS EV3 robot for the warehouse challenge.\n\nThe robot must start in the green zone facing left, follow the black guide line, recognise the coloured dispatch points, locate each parcel using a distance sensor and collect it with a gripper. Deliver parcels in this order: B to bay 1, C to bay 2, and A to bay 3. Use the coloured bay areas to locate each destination.\n\nSubmit your EV3 program and a short evidence folio containing a labelled plan, an algorithm, testing records and an evaluation.","conditions":[{"label":"Length","value":"Working EV3 robot and a short evidence folio","type":"text","id":"sample-ev3-cond-1"},{"label":"Genre","value":"Robotics design-and-make investigation","type":"text","id":"sample-ev3-cond-2"},{"label":"Preparation","value":"Individual planning and programming; practical testing in class","type":"text","id":"sample-ev3-cond-3"},{"label":"Purpose","value":"Develop and evaluate an autonomous parcel delivery solution","type":"text","id":"sample-ev3-cond-4"},{"label":"Equipment","value":"EV3 robot, left colour sensor, front distance sensor, gripper and warehouse challenge mat","type":"text","id":"sample-ev3-cond-5"},{"label":"Draft due date","value":"Teacher to confirm (sample task)","type":"text","id":"sample-ev3-cond-6"},{"label":"Final due date","value":"Teacher to confirm (sample task)","type":"text","id":"sample-ev3-cond-7"},{"label":"Submission","value":"EV3 program, labelled plan, algorithm, testing evidence and evaluation","type":"text","id":"sample-ev3-cond-8"}],"terms":[{"term":"Autonomous","meaning":"Works using programmed instructions and sensor information without continuous human control.","id":"sample-ev3-term-1"},{"term":"Algorithm","meaning":"A sequence of steps that tells the robot how to complete a task.","id":"sample-ev3-term-2"},{"term":"Sensor","meaning":"A component that detects information, such as colour or distance.","id":"sample-ev3-term-3"},{"term":"Debug","meaning":"Find and fix a problem in the robot’s program or behaviour.","id":"sample-ev3-term-4"},{"term":"Evaluate","meaning":"Judge how effectively the robot meets the criteria using test evidence.","id":"sample-ev3-term-5"}],"sections":[{"title":"Understand the challenge and plan","items":[{"text":"Identify the dispatch points B, C and A and their delivery bays 1, 2 and 3.","id":"sample-ev3-step-1-1"},{"text":"Label the start zone, black guide line, coloured locations and storage bays on a warehouse map.","id":"sample-ev3-step-1-2"},{"text":"Break the problem into navigation, colour recognition, parcel collection and delivery.","id":"sample-ev3-step-1-3"},{"text":"Create an algorithm or flowchart and write two measurable success criteria.","id":"sample-ev3-step-1-4"}],"id":"sample-ev3-section-1","expanded":true},{"title":"Build and program the robot","items":[{"text":"Build the EV3 robot with the colour sensor near the left wheel, a front distance sensor and a gripper.","id":"sample-ev3-step-2-1"},{"text":"Program the robot to start in the green zone facing left, follow the line and recognise the coloured pick-up points.","id":"sample-ev3-step-2-2"},{"text":"At each pick-up point, scan for a parcel within 15 cm, approach to about 3 cm and close the gripper.","id":"sample-ev3-step-2-3"},{"text":"Program each delivery in order: B to bay 1, C to bay 2 and A to bay 3, using the coloured bay markers.","id":"sample-ev3-step-2-4"}],"id":"sample-ev3-section-2","expanded":true},{"title":"Test and improve","items":[{"text":"Test each collection and delivery route. Record successful actions and problems with sensing, turning or gripping.","id":"sample-ev3-step-3-1"},{"text":"Adjust sensor thresholds, motor commands or the algorithm and record at least two improvements.","id":"sample-ev3-step-3-2"},{"text":"Retest the robot and compare the results with your success criteria.","id":"sample-ev3-step-3-3"}],"id":"sample-ev3-section-3","expanded":true},{"title":"Evaluate and submit","items":[{"text":"Evaluate the robot’s reliability using test results. Explain what worked and suggest one improvement.","id":"sample-ev3-step-4-1"},{"text":"Submit the EV3 program, labelled map, algorithm, testing log and evaluation.","id":"sample-ev3-step-4-2"}],"id":"sample-ev3-section-4","expanded":true}],"status":"published","created":1792141200000,"updated":1792500000000,"essentialQuestion":"How can we use sensors, algorithms and testing to make an EV3 robot deliver parcels accurately and independently?"};
const demoEnglish={"faculty":"English","subject":"English","unit":"Creative writing: speculative futures","name":"EXAMPLE · The Restricted Routes","title":"The Restricted Routes: A Dystopian Short Story","code":"SAMPLE","year":"8","context":"A youth writing magazine is producing a collection called Tomorrow, Reimagined. Each story must explore how a rule intended to keep people safe could also limit their choices. Imagine a future city where every resident receives an approved walking route each morning. One day, a young person is assigned a route through a street that has been closed for years.","task":"Write an original dystopian short story for a Year 8 audience. Create a main character who faces a difficult decision after discovering something that challenges the city’s rules.\n\nUse a clear narrative structure, develop the setting through carefully chosen details, and show how the character responds to the consequences of their choice. Submit your plan, draft and revised final story.","conditions":[{"label":"Length","value":"450–650 words (example requirement)","type":"text","id":"sample-original-year8-english-2026-condition-1"},{"label":"Genre","value":"Original dystopian short story","type":"text","id":"sample-original-year8-english-2026-condition-2"},{"label":"Preparation","value":"Individual planning, drafting and peer feedback in class","type":"text","id":"sample-original-year8-english-2026-condition-3"},{"label":"Purpose","value":"Entertain readers while exploring control, choice and consequences","type":"text","id":"sample-original-year8-english-2026-condition-4"},{"label":"Audience","value":"Year 8 readers of a fictional school writing magazine","type":"text","id":"sample-original-year8-english-2026-condition-5"},{"label":"Draft due date","value":"Teacher to confirm (sample only)","type":"text","id":"sample-original-year8-english-2026-condition-6"},{"label":"Final due date","value":"Teacher to confirm (sample only)","type":"text","id":"sample-original-y const DEFAULT_CONDITIONS=['Length','Genre','Preparation','Purpose','Draft due date','Final due date','Submission'];

const defaultConditions=()=>DEFAULT_CONDITIONS.map(label=>conditionEntry(label,'',label.includes('due date')?'date':'text'));
function normaliseConditions(t){
 if(Array.isArray(t.conditions))return;
 const old=t.conditions||{};
 const standard=defaultConditions();
 // Upgrade older workspaces without dropping any existing information.
 let extras=[];
 if(old.mode)extras.push(conditionEntry('Work arrangement',old.mode));
 if(old.time)extras.push(conditionEntry('Time allowed',old.time));
 if(old.other)extras.push(conditionEntry('Other conditions',old.other));
 for(const row of standard){if(row.label==='Draft due date')row.value=old.draft||'';if(row.label==='Final due date')row.value=old.final||''}
 t.conditions=[...standard,...extras];
}

function meaningfulImportWarnings(items){
 if(!Array.isArray(items))return [];
 return [...new Set(items.filter(x=>typeof x==='string').map(x=>x.trim()).filter(x=>{
  if(!x)return false;
  if(/^Automated Word conversion:\s*check the original document before publishing\.?$/i.test(x))return false;
  if(/^No\s+A\s*[-–—]\s*E\s+marking standards(?: table)?\b/i.test(x))return false;
  if(/^A\s*[-–—]\s*E\s+marking standards could not be recognised\.?$/i.test(x))return false;
  if(/^No\s+(?:task-specific\s+)?(?:marking criteria|marking standards|achievement standards)\s+(?:found|detected|identified)\b/i.test(x))return false;
  return true;
 }))];
}

function splitReaderText(text,limit){
 const value=String(text||'').trim();if(!value)return[];
 const parts=[];let pending=value;
 while(pending.length>limit){let end=Math.max(pending.lastIndexOf('\n',limit),pending.lastIndexOf('. ',limit),pending.lastIndexOf(' ',limit));if(end<limit*.48)end=limit;else if(pending.slice(end,end+2)==='. ')end+=1;
  parts.push(pending.slice(0,end).trim());pending=pending.slice(end).trim();}
 if(pending)parts.push(pending);return parts;
}
function makeViewerPages(t){
 const width=window.innerWidth||1000,height=window.innerHeight||800;
 // Size-aware chunks rather than a single long scrolling page.
 const budget=width<540?(height<710?240:400):width<900?(height<680?500:750):height<750?750:1300;
 const pages=[];const half=Math.max(160,Math.round(budget*.58));
 const intro=(t.context?'Context\n'+t.context.trim()+'\n\n':'')+(t.essentialQuestion?t.essentialQuestion+'\n\n':'')+(t.task||'Your teacher has not added task instructions yet.');
 splitReaderText(intro,budget).forEach((chunk,i)=>pages.push({kind:'intro',title:'What is my task?',chunk,part:i+1}));
 function groupFields(arr,kind){let list=[],size=0;const limit=Math.max(180,budget*.80);const maxItems=width<650?2:width<1000?4:8;
 for(const it of arr){const weight=(String(it.label||it.term||'').length+String(it.value||it.meaning||'').length+35);if(list.length&&(list.length>=maxItems||size+weight>limit)){pages.push({kind,title:kind==='conditions'?'Conditions':'Key terms',items:list});list=[];size=0}list.push(it);size+=weight;}
 if(list.length||!arr.length)pages.push({kind,title:kind==='conditions'?'Conditions':'Key terms',items:list});}
 groupFields(conditionsOf(t).filter(x=>String(x.value||'').trim()),'conditions');groupFields(t.terms||[],'terms');
 (t.sections||[]).forEach((section,i)=>{
  const label=`${i+1}. ${section.title||'Untitled section'}`,list=[];
  let stack=[],size=0;const maxItems=width<540?1:width<900?2:4;
  const addStack=()=>{if(stack.length){pages.push({kind:'steps',title:label,sectionNumber:i+1,sectionTotal:t.sections.length,aiLevel:section.aiLevel,items:stack});stack=[];size=0}};
  for(const [j,it] of (section.items||[]).entries()){
   const chunks=splitReaderText(it.text||'Step not yet written',Math.max(160,budget-100));
   for(let k=0;k<chunks.length;k++){
    const item={...it,text:chunks[k],letter:String.fromCharCode(97+j),continuation:k>0,hasCheckbox:k===chunks.length-1};
    const weight=chunks[k].length+65;
    if(stack.length&&(stack.length>=maxItems||size+weight>budget))addStack();
    stack.push(item);size+=weight;
   }
  }
  addStack();if(!(section.items||[]).length)pages.push({kind:'steps',title:label,sectionNumber:i+1,sectionTotal:t.sections.length,aiLevel:section.aiLevel,items:[]});
 });
 const criteria=criteriaOf(t).rows;
 criteria.forEach((row,i)=>pages.push({kind:'criterion',title:'Achievement standards',item:row,index:i+1,count:criteria.length}));
 return pages;
}

function parseTaskJSON(data){
 const src=data&&typeof data.task==='object'&&!Array.isArray(data.task)&&data.task!==null?data.task:data;
 if(!src||typeof src!=='object'||Array.isArray(src))throw Error('No recognisable assessment record');
 const clean=x=>typeof x==='string'?x.slice(0,45000):x==null?'':String(x).slice(0,45000);
 const warnings=meaningfulImportWarnings(src.importWarnings).map(clean).slice(0,35);
 const required=(key,defaultValue,label)=>{const v=clean(src[key]).trim();if(!v){warnings.push('Missing '+label+'; entered a temporary value.');return defaultValue;}return v;};
 const faculty=required('faculty','Unsorted','faculty');
 const subject=required('subject','Unassigned subject','subject');
 const unit=required('unit','Needs unit allocation','unit');
 const name=required('name',clean(src.title)||clean(src.sourceFile)||'Imported task','task name');
 if(!clean(src.task).trim())warnings.push('What is my task? is missing or empty.');
 const normalizeArray=(v,field)=>{if(v==null)return[];if(Array.isArray(v))return v;warnings.push(field+' had an unexpected format; review original.');return[];};
 const rawTerms=normalizeArray(src.terms,'Key terms');
 const rawConditions=normalizeArray(src.conditions,'Conditions');
 const rawSections=normalizeArray(src.sections,'Steps for Success');
 let sections=rawSections.slice(0,80).map(v=>{
  const section=typeof v==='string'?{title:'',items:[v]}:v||{};
  return {id:genId(),title:clean(section.title),aiLevel:aiLevelInfo(section.aiLevel)?.level||null,expanded:true,items:normalizeArray(section.items,'Section items').slice(0,140).map(it=>({id:genId(),text:clean(typeof it==='string'?it:it?.text)}))};
 });
 if(!sections.length){warnings.push('No Steps for Success were identified; create or check sections.');sections=[{id:genId(),title:'Needs review',expanded:true,items:[]}];}
 else if(sections.some(x=>!x.items.length))warnings.push('One or more Steps for Success sections contain no actions.');
 const criteria=normaliseCriteria(src.criteria);
 const conditions=rawConditions.slice(0,90).map(c=>typeof c==='string'?conditionEntry('Condition',clean(c)):conditionEntry(clean(c?.label),clean(c?.value),c?.type==='date'?'date':'text'));
 const terms=rawTerms.slice(0,90).map(x=>({id:genId(),term:clean(x?.term||''),meaning:clean(x?.meaning||'')}));
 if(!terms.length)warnings.push('No key terms were identified.');
 if(!conditions.length)warnings.push('No conditions were identified.');
 return {id:genId(),faculty,subject,unit,name,title:clean(src.title)||name,code:clean(src.code),year:clean(src.year),context:clean(src.context),essentialQuestion:clean(src.essentialQuestion),task:clean(src.task),conditions,terms,sections,criteria,workflow:normaliseWorkflow(src.workflow),supportTiers:{...defaultSupportTiers(),...(src.supportTiers||{})},sourceFile:clean(src.sourceFile),sourceText:clean(src.sourceText),importWarnings:[...new Set(warnings)].slice(0,60),status:'draft',created:Date.now(),updated:Date.now()};
}

// Import compatibility: batch, individual, plain arrays, and the converter's ZIP.
// Validate everything before altering local drafts.
function importTaskCollection(raw){
 let entries;
 if(Array.isArray(raw))entries=raw;
 else if(raw&&Array.isArray(raw.tasks))entries=raw.tasks;
 else if(raw&&typeof raw==='object'&&!Array.isArray(raw))entries=[raw];
 else throw Error('Choose a valid assessment JSON or converter ZIP.');
 if(!entries.length)throw Error('No tasks found in file.');
 const tasks=[],skipped=[];
 entries.forEach((entry,i)=>{try{const task=parseTaskJSON(entry);tasks.push(task);}catch(e){skipped.push('Task '+(i+1)+': '+e.message)}});
 return {tasks,skipped};
}

async function taskImportFile(file){
  const name=file.name.toLowerCase();
  if(name.endsWith('.zip')){
    const content=await readImportZip(file);
    try{return JSON.parse(content)}
    catch(err){throw Error('The ZIP contains an invalid import_all_tasks.json file: '+err.message)}
  }
  if(!name.endsWith('.json') && file.type!=='application/json'){
    throw Error('Please select a .json file or the converted-tasks .zip archive.');
  }
  try{return JSON.parse(await file.text())}
  catch(err){throw Error('The selected file is not valid JSON: '+err.message)}
}
async function readImportZip(file){
  // Read the ZIP directory and extract only the JSON batch manifest.
  // ZIPs containing deflated JSON use the built-in DecompressionStream API.
  const buf=await file.arrayBuffer(),v=new DataView(buf),bytes=new Uint8Array(buf),dec=new TextDecoder();
  let eocd=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){
    if(v.getUint32(i,true)===0x06054b50){eocd=i;break}
  }
  if(eocd<0)throw Error('This does not appear to be a valid ZIP archive.');
  const entries=v.getUint16(eocd+10,true),central=v.getUint32(eocd+16,true);
  let pos=central,chosen=null;
  for(let i=0;i<entries;i++){
    if(pos+46>buf.byteLength||v.getUint32(pos,true)!==0x02014b50)break;
    const method=v.getUint16(pos+10,true),size=v.getUint32(pos+20,true);
    const nl=v.getUint16(pos+28,true),el=v.getUint16(pos+30,true),cl=v.getUint16(pos+32,true);
    const offset=v.getUint32(pos+42,true);
    const name=dec.decode(bytes.subarray(pos+46,pos+46+nl)).replace(/\\/g,'/');
    if(name==='import_all_tasks.json'||name.endsWith('/import_all_tasks.json')){
      chosen={method,size,offset};break;
    }
    pos+=46+nl+el+cl;
  }
  if(!chosen)throw Error('This ZIP does not contain import_all_tasks.json. Use the ZIP produced by the batch converter.');
  let p=chosen.offset;
  if(p+30>buf.byteLength||v.getUint32(p,true)!==0x04034b50)throw Error('The ZIP has an invalid entry header.');
  p+=30+v.getUint16(p+26,true)+v.getUint16(p+28,true);
  if(p+chosen.size>buf.byteLength)throw Error('The ZIP entry is incomplete.');
  const part=bytes.slice(p,p+chosen.size);
  if(chosen.method===0)return dec.decode(part);
  if(chosen.method!==8)throw Error('Unsupported ZIP compression. Extract the archive and select import_all_tasks.json.');
  if(typeof DecompressionStream==='undefined')throw Error('ZIP import requires a recent Chrome or Edge browser. Extract the ZIP and select import_all_tasks.json instead.');
  try{
    const decoded=await new Response(new Blob([part]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    return dec.decode(decoded);
  }catch(err){throw Error('Could not decompress the ZIP. Extract it and select import_all_tasks.json instead.');}
}
async function importBatchFiles(files){

}

async function unzipSelected(file,accept){

 let eocd=-1;
 for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--)if(v.getUint32(i,true)===0x06054b50){eocd=i;break;}
 if(eocd<0)throw Error('Invalid ZIP or Word file.');

 for(let i=0;i<count;i++){
  if(pos+46>buf.byteLength||v.getUint32(pos,true)!==0x02014b50)break;
  const method=v.getUint16(pos+10,true),size=v.getUint32(pos+20,true),nl=v.getUint16(pos+28,true),el=v.getUint16(pos+30,true),cl=v.getUint16(pos+32,true),offset=v.getUint32(pos+42,true);

  if(!accept(name))continue;
  const j=offset+30+v.getUint16(offset+26,true)+v.getUint16(offset+28,true);
  const compressed=bytes.slice(j,j+size);
  let output;
  if(method===0)output=compressed;
  else if(method===8){
   if(typeof DecompressionStream==='undefined')throw Error('Word conversion requires a recent Chrome or Edge browser.');
   try{output=new Uint8Array(await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());}
   catch{throw Error('This browser could not decompress the Word file. Try Chrome or Edge.');}

  results.push({name,bytes:output});
 }

}

// Keep the handout to exactly two pages: overview on page one and steps on page two.
// These estimates mirror the actual PDF layout, using conservative line measurements.
function chooseTwoPageScale(t){
 const cv=document.createElement('canvas'),cx=cv.getContext('2d');
 const CONTENT=511.28, PAGE_H=841.89;
 function wrap(str,w,sz,bold=false){cx.font=`${bold?'bold ':''}${sz}px Arial`;let n=0;for(const para of String(str||'').split('\n')){if(!para.trim()){n++;continue}let line='';for(const word of para.trim().split(/\s+/)){let next=line?line+' '+word:word;if(line&&cx.measureText(next).width*1.11>w){n++;line=word}else line=next;}n++;}return n;}
 function fit(s){
  let y1=PAGE_H-40;
  y1-=24*s + wrap(t.title||t.name,CONTENT-78,16.0*s,true)*20*s + 42*s;
  // Context is presented inside the WHAT IS MY TASK panel, not as a separate heading.
  const intro=[t.context,t.essentialQuestion,t.task].filter(x=>x?.trim()).join('\n\n');
  y1-=(33+wrap(intro,CONTENT-22,10*s)*13.5+16)*s;
  y1-=30*s;
  const cond=conditionsOf(t).filter(c=>c.value?.trim());
  for(const c of cond)y1-=(Math.max(wrap(c.label,108,10*s,true),wrap(conditionDisplay(c),CONTENT-128,10*s))*14.0+5)*s;
  y1-=23*s;
  for(const row of t.terms)y1-=(Math.max(wrap(row.term,116,9.6*s,true),wrap(row.meaning,CONTENT-147,9.6*s))*13.5+7)*s;
  y1-=6*s;
  let y2=PAGE_H-32-(32+12)*s;
  for(let i=0;i<t.sections.length;i++){
   const sec=t.sections[i],ai=aiLevelInfo(sec.aiLevel);
   const badgeW=ai?Math.max(94*s,(('AI LEVEL '+ai.level+' - '+ai.short).length*4.6+14)*s):0;
   const headingText=`${i+1}.   ${sec.title||'Untitled section'}`;
   const headingLines=wrap(headingText,CONTENT-20*s-(ai?badgeW+13*s:0),11.1*s,true);
   y2-=(Math.max(29,13.1*headingLines+13)+6)*s;
   for(let j=0;j<t.sections[i].items.length;j++){
    const text=String.fromCharCode(97+j)+'.  '+t.sections[i].items[j].text;
    y2-=(Math.max(19,wrap(text,CONTENT-72,9.75*s)*13.3+7))*s;
   }
   y2-=6*s;
  }
  return {page1:y1,page2:y2};
 }
 for(let i=100;i>=80;i--){let s=i/100,h=fit(s);if(h.page1>=51&&h.page2>=51)return {ok:true,scale:s,heights:h};}

}

 function appendCriteriaPages(){
   // All A-E descriptors, comments and final result MUST stay on one landscape A4 page.
   // Try increasingly compact but legible layouts; never drop a criterion or generate
   // a second landscape sheet as an unexpected side effect.
   const crit=criteriaOf(t),grades=['A','B','C','D','E'];
   const CW=PAGE_H-2*M,col0=146,colW=(CW-col0)/5;
   const layouts=[1,.96,.92,.88,.84];
   const bottomMargin=40, commentsH=49;
   const trailingH=11+14+commentsH+13+25+bottomMargin;
   function makeLayout(scale){
     const descriptorSize=8.35*scale, criterionSize=8.55*scale;
     const descriptorLead=10.05*scale, criterionLead=10.35*scale;
     const rows=crit.rows.map(row=>{
       const desc=grades.map(g=>wrap(row.descriptors?.[g]||'',colW-12,descriptorSize,false));
       const subject=wrap((row.strand?row.strand+' / ':'')+row.criterion,col0-17,criterionSize,true);
       const height=Math.max(subject.length*criterionLead,...desc.map(lines=>lines.length*descriptorLead),12)+11*scale;
       return {desc,subject,height,descriptorSize,criterionSize,descriptorLead,criterionLead};
     });
     const headerH=23, headingH=33;
     const capacity=(PAGE_W-40)-headingH-headerH-trailingH;
     const used=rows.reduce((n,r)=>n+r.height,0);
     return {rows,headingH,headerH,capacity,used,scale};
   }
   const layout=layouts.map(makeLayout).find(l=>l.used<=l.capacity+0.01);
   if(!layout){
     throw Error(`The ${crit.rows.length} marking criteria cannot fit legibly with teacher comments and final result on one A4 landscape page. Please shorten or combine the criteria before exporting. No criteria have been removed.`);
   }
   newPage(true);
   const title=(crit.title||'TASK-SPECIFIC MARKING CRITERIA').slice(0,92).toUpperCase();
   label(title,M,y-11,11.7,true,'#071F61');
   label((t.title||t.name).slice(0,74),M+410,y-11,9.2,false,'#45566A');
   y-=layout.headingH;
   rect(M,y,CW,layout.headerH,'#071F61');

   grades.forEach((g,i)=>label(g,M+col0+i*colW+7,y-15,9.8,true,'#FFFFFF'));

     });

   });

 // One self-contained landscape marking sheet with a compact table and writing area.
 const cr=criteriaOf(t),widths=[2070,2435,2435,2435,2435,2435];
 const allText=cr.rows.reduce((n,r)=>n+String(r.criterion||'').length+Object.values(r.descriptors||{}).reduce((a,b)=>a+String(b||'').length,0),0);
 // The Word table is fit to one page using compact type, small cell padding
 // and no blank lines between the rubric and marking fields.
 const dense=cr.rows.length>7||allText>3500;
 const veryDense=cr.rows.length>10||allText>5500;
 const size=veryDense?14:dense?15:16;
 const lineHeight=veryDense?200:dense?207:218;
 const pad=veryDense?32:dense?42:55;
 let result=xmlP(cr.title||'TASK-SPECIFIC STANDARDS',{bold:true,size:25,after:100,line:285});
 const hd=[xmlP('Criterion',{bold:true,size:18,color:'FFFFFF',line:205}),...'ABCDE'.split('').map(g=>xmlP(g,{bold:true,size:18,color:'FFFFFF',line:205}))];
 result+=wTable([wRow(hd,widths,{shade:'071F61',pad:55}),...cr.rows.map((c,i)=>wRow([
   xmlP((c.strand?c.strand+' / ':'')+c.criterion,{bold:true,size:size+1,line:lineHeight}),
   ...'ABCDE'.split('').map(g=>xmlP(c.descriptors?.[g]||'',{size,line:lineHeight}))
 ],widths,{shade:i%2===0?'F3F5FA':undefined,pad}))],widths,{pad});
 result+=xmlP('Teacher comments:',{bold:true,size:18,before:155,after:45,line:230});
 // Shallow ruled area remains editable in Word and never carries to another page
 // on normal-length approved A-E matrices.
 const comments=xmlP(' ',{size:18,line:215})+xmlP(' ',{size:18,line:215});
 result+=wTable([wRow([comments],[14245],{lines:true})],[14245],{pad:45});
 result+=xmlP('Final result: ___________________',{bold:true,size:19,before:105,line:235});
 return result;
}
async function exportBatch(){if(!db.tasks.length){alert('No tasks to export');return}const manifest={schema:'accessible-task-builder/batch-v2',tasks:db.tasks.map(compactTask)};const entries=[{name:'import_all_tasks.json',data:JSON.stringify(manifest,null,2)},{name:'README.txt',data:'Tasks exported from local browser. Review all content before publication.'}];for(let i=0;i<db.tasks.length;i++){const t=db.tasks[i],name=String(i+1).padStart(2,'0')+'_'+filename(t);entries.push({name:'tasks/'+name+'.json',data:JSON.stringify({schema:'accessible-task-builder/v2',task:compactTask(t)},null,2)});try{const word=makeDocx(t);entries.push({name:'word/'+name+'.docx',data:new Uint8Array(await word.arrayBuffer())})}catch(err){entries.push({name:'word/'+name+'_EXPORT_ERROR.txt',data:String(err.message||err)})}try{entries.push({name:'pdf/'+name+'.pdf',data:await buildInteractivePDF(t,.91)})}catch(err){entries.push({name:'pdf/'+name+'_EXPORT_ERROR.txt',data:String(err.message||err)})}}fileDownload(makeZip(entries),'accessible-task-batch-export.zip')}
document.addEventListener('input',e=>{const el=e.target;if(el.hasAttribute('data-criteria-title')&&task()){criteriaOf(task()).title=el.value;debounceSave()}});

async function saveLocalDB(){try{const response=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tasks:db.tasks})});if(!response.ok)throw Error('Server unavailable');const x=await response.json();alert(`${x.saved} tasks saved to this computer's SQLite pilot database.`)}catch(e){alert('Pilot database unavailable. Run Start_Database_Pilot.bat from the downloaded suite. The public GitHub Pages website cannot save to this Python database.') }}
async function loadLocalDB(){try{const response=await fetch('/api/tasks');if(!response.ok)throw Error('Server unavailable');const x=await response.json();if(!Array.isArray(x.tasks))throw Error('Invalid response');const existing=new Set(db.tasks.map(t=>t.id));let added=0;for(const t of x.tasks){if(existing.has(t.id))continue;t.importWarnings=meaningfulImportWarnings(t.importWarnings);db.tasks.push(t);added++}save();gotoHome();alert(`Loaded ${added} additional tasks from the local pilot database. Existing browser tasks were kept.`)}catch(e){alert('Pilot database unavailable. Start the local database server first.') }}
